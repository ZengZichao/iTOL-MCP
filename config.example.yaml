# iTOL-MCP 服务器配置示例
# 复制为 itol_mcp.yaml 后按需修改；未提供该文件时全部使用默认值。
# 注意：不要在配置文件中写入明文 API Key，密钥请使用三通道（工具参数/环境变量/密钥文件）。

# 工作区根目录（启动时自动创建；默认 $ITOL_MCP_WORKSPACE 或 <cwd>/.itol_mcp_workspace）
workspace_dir: null

# 密钥文件路径（默认 ~/.config/itol-mcp/.itolapi.key）
key_file: null

# 导出目录（默认 <workspace>/exports）
export_dir: null

# 模板输出目录（默认 <workspace>/templates）
template_dir: null

# 网络
timeout: 120.0          # 上传/导出超时（秒）
max_retries: 3          # 429/5xx 重试次数
backoff_factor: 1.0     # 指数退避因子

# 文件限制
max_file_bytes: 52428800        # 单文件上限 50MB
max_upload_files: 50            # 单次上传 ZIP 内文件上限
max_rows: 200000                # 表格行数上限

# 密钥文件权限严格模式：True 时 group/other 权限位存在即拒绝读取
strict_permissions: false

# 日志
log_level: INFO